version: '3.8'

services:
  portall:
    image: ghcr.io/idrinkx/portall:latest
    pull_policy: always
    container_name: portall
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      COOKIE_SECURE: "true"
      # Default false. Set TRUST_PROXY=1 in .env when traffic only reaches Portall via NPM.
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      DEBUG: "false"

      # Obligatoire: remplacez par une vraie clé longue et aléatoire
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}"
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:?CREDENTIALS_ENCRYPTION_KEY is required}"

      # Requis uniquement pendant la configuration initiale (définir dans .env)
      SETUP_TOKEN: "${SETUP_TOKEN:-}"

      # Optionnel: overrides du portail si besoin
      APP_URL: "${APP_URL:?APP_URL is required in production}"
      BASE_PATH: "${BASE_PATH:-}"
    volumes:
      # Logo et fichiers de config
      - ./config:/config

      # DB Tautulli (lecture seule)
      - /mnt/user/appdata/tautulli:/tautulli-data:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # Optionnel: reseau custom
    # networks:
    #   - plex-network

# Optionnel
# networks:
#   plex-network:
#     driver: bridge
